async function execute(name,id){if(name==='delete')await api(`${apiPath(current)}/${id}`,{method:'DELETE'});else await post(`${apiPath(current)}/${id}/${name}`,name==='reject'?{note:'后台审核拒绝'}:{});notify(({pause:'任务已暂停',resume:'任务已恢复',cancel:'任务已取消',delete:'记录已删除',retry:'失败用户已重新入队',approve:'审核已通过',rescan:'历史补扫已安排'})[name]||'操作成功')}
$('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)load(b.dataset.nav)});$('content').addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,Number(a.dataset.id));return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;page=1;render();return}const p=e.target.closest('[data-page]');if(p&&!p.disabled){page=Number(p.dataset.page);render()}});$('content').addEventListener('input',e=>{if(e.target.id==='search'){const position=e.target.selectionStart;query=e.target.value;page=1;render();$('search').focus();$('search').setSelectionRange(position,position)}});
$('create').onclick=()=>edit();$('refresh').innerHTML=icon('refresh')+' <span class="refresh-label">刷新</span>';$('refresh').onclick=()=>load();$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('submitModal').onclick=async()=>{if(!submitHandler)return;$('submitModal').disabled=true;try{await submitHandler()}catch(e){notify(e.message,true)}finally{$('submitModal').disabled=false}};
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const all=[...$('modal').querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled&&x.getClientRects().length);if(!all.length)return;if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});
$('changePassword').onclick=()=>openModal('修改密码',`<div class="form-grid">${field('oldPassword','原密码','password','','',true)}${field('newPassword','新密码','password','','至少 8 位',true)}${field('newPassword2','确认新密码','password','','',true)}</div>`,async()=>{if($('newPassword').value!==$('newPassword2').value)throw Error('两次输入的新密码不一致。');await post('account/password',{old_password:$('oldPassword').value,new_password:$('newPassword').value});notify('密码已修改，其他设备上的登录已失效');closeModalAfterSubmit()});
function showMe(){$('meName').textContent=me.username||'管理员';$('meRole').textContent=me.role==='super'?'超级管理员':'管理员';$('meAvatar').textContent=(me.username||'AD').slice(0,2).toUpperCase()}
$('logout').onclick=async()=>{try{const res=await fetch('/admin/logout',{method:'POST',headers:{'X-Requested-With':'admin-console'}});if(!res.ok)throw Error('退出失败，请稍后重试');location.replace('/admin/login')}catch(e){notify(e.message,true)}};
window.addEventListener('pagehide',()=>{document.body.style.visibility='hidden'});window.addEventListener('pageshow',async e=>{if(e.persisted){try{await api('session');document.body.style.visibility=''}catch(error){location.replace('/admin/login')}}else document.body.style.visibility=''});window.addEventListener('resize',closeSelect);
$('brandIcon').innerHTML=icon('send');$('today').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});api('session').then(m=>{me=m;showMe()}).catch(()=>{}).finally(()=>{const first=groups.flatMap(([,items])=>items).find(allowed);if(first)load(first);else{nav();$('pageTitle').textContent='暂无可访问页面';$('pageDescription').textContent='';$('create').hidden=true;$('content').innerHTML='<div class="panel empty">当前账号尚未分配可访问的页面，请联系超级管理员在「角色权限」中分配。</div>'}});
</script>

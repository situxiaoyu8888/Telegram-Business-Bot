function compose(){const categories=[...new Set(['一般通知',...routes.map(r=>r.category)])];const body=`<div class="compose"><div class="form-grid">${field('pTitle','任务名称','text','','例如：本周精选招聘机会',true)}<div class="field"><label for="pCategory">业务类型</label><input id="pCategory" autocomplete="off" value="${esc(categories[0])}" placeholder="选择或输入业务类型"><div class="category-suggestions">${categories.map(x=>`<button type="button" data-category="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>${selectField('pBot','发送渠道',[['auto','按业务类型自动选择'],...botOptions()],'auto')}${selectField('pType','内容形式',[['text','纯文本'],['photo','图片 + 文案'],['video','视频 + 文案']],'text')}${selectField('pTarget','接收用户',[['all','该机器人的全部用户'],['language','按语言筛选'],['telegram_ids','指定 Telegram ID']],'all')}<div class="field full" id="targetBox" hidden><label for="pTargetValue">筛选条件</label><input id="pTargetValue" placeholder="多个 ID 用逗号分隔，或填写语言代码"></div><div class="upload-box" id="mediaBox" hidden><div class="upload-row"><input type="file" id="mediaFile"><button type="button" id="upload">上传</button></div><div class="hint" id="uploadStatus">上传媒体，或填写公网链接 / 当前机器人的 file_id。</div><div class="media-preview" id="mediaPreview"></div><div class="form-grid" style="margin-top:14px">${field('pMediaURL','媒体链接','url','','https://…',true)}${field('pFileID','或 Telegram file_id','text','','须属于当前发送机器人',true)}${selectField('pMode','正文展示方式',[['auto','自动选择'],['caption','作为媒体说明'],['separate','媒体后单独发送正文']],'auto',true)}</div></div><div class="section-label">消息内容</div><div class="field full"><label class="check"><input id="pPersonalize" type="checkbox" checked>自动添加「亲爱的用户姓名:」</label><span class="hint">优先读取用户的显示姓名；未设置姓名时使用用户名。</span></div><div class="field full"><label for="pContent">正文 <small>支持 Telegram HTML</small></label><textarea id="pContent" rows="7" placeholder="你好，我们为你准备了一些新的机会。&#10;&#10;<b>本周精选</b>&#10;在这里写下你想分享的内容…"></textarea><span class="hint" id="charCount">0 字</span></div>${field('pButtonText','按钮文字（选填）','text','','查看详 openModal('新建消息推送',body,async()=>{const payload={title:value('pTitle'),category:value('pCategory'),message_type:value('pType'),target_type:value('pTarget'),target_value:value('pTargetValue'),personalize:$('pPersonalize').checked,content:value('pContent'),parse_mode:'HTML',button_text:value('pButtonText'),button_url:value('pButtonURL'),media_url:value('pMediaURL'),media_file_id:value('pFileID'),content_mode:value('pMode'),scheduled_at:''};if(!payload.title||!payload.content)throw Error('请填写任务名称和消息正文。');if(value('pBot')!=='auto')payload.bot_id=Number(value('pBot'));if(value('pWhen')!=='now'){if(!value('pSchedule'))throw Error('请选择发送时间。');const date=new Date(value('pSchedule'));if(!Number.isFinite(date.getTime())||date<=new Date())throw Error('请选择未来的发送时间。');payload.scheduled_at=date.toISOString()}if(value('pWhen')==='repeat'){const n=Number(value('pInterval')),seconds=n*Number(value('pUnit'));if(!Number.isInteger(n)||n<1||seconds>31622400)throw Error('请输入正整数周期，最长 366 天。');payload.repeat_seconds=seconds}if(payload.message_type==='text'){payload.media_url='';payload.media_file_id='';payload.content_mode='auto'}const result=await post('pushes',payload);notify(`任务 #${result.id} 已创建`);closeModalAfterSubmit();await load('pushes')},{wide:true,label:'创建推送',hint:'定时任务创建后可暂停与恢复'});
$('pType').onchange=()=>{$('mediaBox').hidden=value('pType')==='text';$('mediaFile').accept=value('pType')==='photo'?'image/jpeg,image/png,image/webp':'video/mp4,video/quicktime';$('pMediaURL').value='';$('pFileID').value='';$('mediaFile').value='';$('mediaPreview').replaceChildren();$('uploadStatus').textContent='上传媒体，或填写链接 / file_id。';preview()};$('pTarget').onchange=()=>{$('targetBox').hidden=value('pTarget')==='all';$('pTargetValue').placeholder=value('pTarget')==='language'?'例如：zh-hans':'例如：123456789,987654321'};$('pWhen').onchange=()=>{$('scheduleBox').hidden=value('pWhen')==='now';$('repeatBox').hidden=value('pWhen')!=='repeat';$('submitModal').textContent=value('pWhen')==='repeat'?'创建周期任务':value('pWhen')==='schedule'?'创建定时任务':'创建推送'};['pContent','pPersonalize','pBot','pCategory','pButtonText'].forEach(id=>$(id).addEventListener('input',preview));$('upload').onclick=upload;preview()}
function preview(){const selected=value('pBot');const botID=selected==='auto'?(routes.find(r=>r.category===value('pCategory'))?.bot_id||0):Number(selected);$('previewBot').textContent=botName(botID);$('previewGreeting').hidden=!$('pPersonalize').checked;const raw=value('pContent');const template=document.createElement('template');template.innerHTML=raw;$('previewContent').textContent=template.content.textContent||'你的消息将展示在这里…';$('previewContent').style.color=raw?'var(--ink)':'#758297';$('charCount').textContent=Array.from(raw).length+' 字 · 自动称呼会在发送时添加';$('previewButton').hidden=!value('pButtonText');$('previewButton').textContent=value('pButtonText')}
async function upload(){const file=$('mediaFile').files[0];if(!file){notify('请先选择媒体文件。',true);return}const mode=value('pType');const button=$('upload');const body=new FormData();body.append('file',file);body.append('type',mode==='photo'?'image':'video');button.disabled=true;$('submitModal').disabled=true;$('uploadStatus').textContent='正在上传…';try{const r=await sendUpload(body);if(r.status===401){location.replace('/admin/login');throw Error('请重新登录')}const data=await r.json();if(!r.ok)throw Error(data.error||'上传失败');if(value('pType')!==mode)throw Error('消息类型已改变，请重新上传。');$('pMediaURL').value=data.url;$('pFileID').value='';$('uploadStatus').textContent='上传成功 · '+file.name;const media=document.createElement(mode==='photo'?'img':'video');media.src=data.url;if(mode==='video')media.controls=true;$('mediaPreview').replaceChildren(media)}catch(e){$('uploadStatus').textContent='上传失败：'+e.message;notify(e.message,true)}finally{button.disabled=false;$('submitModal').disabled=false}}
async function action(name,id){const row=rows.find(r=>r.id===id)||bots.find(b=>b.id===id);if(!row)return;try{if(name==='edit'){edit(row);return}if(name==='detail'&&['withdrawals','deposits'].includes(current)){openModal(current==='withdrawals'?'提现详情':'充值详情',`<dl class="detail-grid">${walletDetail(row).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`,null);return}if(name==='detail'){const names=Object.fromEntries((columns[current]||[]).map(([l,k])=>[k,l]));openModal('记录详情',`<dl class="detail-grid">${Object.entries(row).map(([k,v])=>`<dt>${esc(names[k]||k)}</dt><dd>${esc(typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl>`,null);return}if(name==='recipients'){const list=await api(`pushes/${id}/recipients`);openModal('发送明细 · '+row.title,`<div class="table-wrap"><table><thead><tr><th>Telegram ID</th><th>状态</th><th>尝试次数</th><th>送达时间</th><th>错误信息</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.telegram_user_id}</td><td>${badge(r.status)}</td><td>${r.attempts}</td><td>${fmtDate(r.sent_at)}</td><td><span class="clip" title="${esc(r.last_error)}">${esc(r.last_error||'—')}</span></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">任务尚未开始发送</div>':''}</div>`,null,{wide:true});return}
if(current==='deposits'&&name==='assign'){openModal('指定入账用户',`<div class="form-grid">${selectField('depUser','入账给',addressUsers.map(u=>[String(u.id),addressUserLabel(u)]),String(addressUsers[0]?.id||''),true,true)}<div class="hint full">这笔 ${usdt(row.amount)} USDT 转入了多人共用的地址 <span class="mono">${esc(row.txid)}</span>，请核实转账人后指定。</div></div>`,async()=>{await post(`deposits/${id}/assign`,{user_id:Number(value('depUser'))});notify('已入账');closeModalAfterSubmit();await load()},{label:'入账'});return}if(current==='deposits'&&name==='dconfirm'){openModal('确认 ERC20 充值',`<div class="form-grid">${field('depAmount','核对后的到账数量（USDT-ERC20）','text',usdt(row.amount),'',true)}<div class="hint full">用户提交的交易哈希：<span class="mono">${esc(row.txid)}</span>。请在区块浏览器核对收款地址和数量后入账。</div></div>`,async()=>{await post(`deposits/${id}/confirm`,{amount:value('depAmount')});notify('已入账');closeModalAfterSubmit();await load()},{label:'确认入账'});return}if(current==='deposits'&&name==='dreject'){openModal('驳回充值',field('depNote','原因（会发给用户）','text','','例如：未查到这笔转账',true),async()=>{await post(`deposits/${id}/reject`,{note:value('depNote')});notify('已驳回');closeModalAfterSubmit();await load()},{label:'驳回'});return}if(name==='reply'||name==='complete'){const reply=name==='reply';openModal(reply?'回复客服工单':'确认提现完成',reply?`<div class="hint" style="margin-bottom:16px">${esc(row.content)}</div><div class="field"><label for="answer">回复内容</label><textarea id="answer">${esc(row.admin_reply||'')}</textarea></div>`:(row.network==='BANK'?field('answer','转账凭证 / 流水号','text','','请输入银行转账流水号或备注',true):field('answer','链上交易 TxID','text','','请输入已广播交易的 TxID',true)),async()=>{if(!value('answer'))throw Error('请填写内容。');await post(reply?`tickets/${id}/reply`:`withdrawals/${id}/complete`,reply?{reply:value('answer')}:{txid:value('answer')});notify('操作成功');closeModalAfterSubmit();await load()});return}
if(current==='news_feeds'&&name==='fetch'){const r=await post(`news-feeds/${id}/fetch`);notify(`抓取完成，新增 ${r.added} 条`);await load();return}
if(current==='redpackets'&&name==='claims'){const list=await api(`redpackets/${id}/claims`);openModal('领取明细 · 红包 #'+id,list.length?`<div class="table-wrap"><table><thead><tr><th>领取人</th><th>Telegram ID</th><th>金额</th><th>币种</th><th>时间</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${c.telegram_user_id}</td><td><strong>${usdt(c.amount)}</strong></td><td>${esc(currencyName(row.currency))}</td><td>${fmtDate(c.created_at)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">还没有人领取</p>',null,{wide:true});return}
if(current==='users'&&name==='paypass'){openModal('重置支付密码','<p style="line-height:1.9;color:var(--muted)">清除该用户的支付密码。用户下次发红包、提现或付款时，会被要求重新设置。请先核实是用户本人申请。</p>',async()=>{await post(`users/${id}/paypass`);notify('支付密码已重置');closeModalAfterSubmit()},{label:'确认重置'});return}
if(current==='users'&&name==='balance'){const list=await api(`users/${id}/balances`);const who=[row.first_name,row.last_name].filter(Boolean).join(' ')||row.username||String(row.telegram_user_id);openModal('钱包余额 · '+who,`<div class="table-wrap" style="margin-bottom:16px"><table><thead><tr><th>币种</th><th>可用</th><th>冻结</th></tr></thead><tbody>${list.map(b=>`<tr><td>${esc(b.name)} <span class="subtext">${esc(b.code)}</span></td><td><strong>${usdt(b.available)}</strong></td><td>${usdt(b.frozen)}</td></tr>`).join('')}</tbody></table></div><div class="form-grid">${selectField('adjCurrency','调整币种',list.map(b=>[b.code,b.name]),list[0]?.code||'USDT',true)}${field('adjAmount','调整金额（负数为扣减）','text','','例如：100 或 -50',true)}${field('adjRemark','调整原因','text','','例如：ERC20 充值 0x…',true)}</div>`,async()=>{if(!value('adjAmount')||!value('adjRemark'))throw Error('请填写调整金额和原因。');await post(`users/${id}/adjust`,{currency:value('adjCurrency'),amount:value('adjAmount'),remark:value('adjRemark')});notify('余额已调整');closeModalAfterSubmit();await load()},{label:'确认调整'});return}
if(current==='shop_messages'&&name==='chat'){const t=await api('shop-messages/'+id);const bubbles=t.messages.map(m=>`<div style="display:flex;justify-content:${m.from_merchant?'flex-end':'flex-start'};margin:6px 0"><div style="max-width:75%;padding:8px 12px;border-radius:12px;background:${m.from_merchant?'var(--brand-soft)':'#f3f5f9'};white-space:pre-wrap">${esc(m.content)}${m.order_id?`<div class="subtext">关联订单 #${m.order_id}</div>`:''}${m.product_id?`<div class="subtext">来自商品 #${m.product_id}</div>`:''}<div class="subtext">${m.from_merchant?esc(m.operator||'商家')+' · ':''}${fmtDate(m.created_at)}</div></div></div>`).join('');openModal('与 '+(row.buyer_name||'买家')+' 的对话 · '+(t.merchant_name||''),`<div style="max-height:46vh;overflow:auto;margin-bottom:12px" id="chatBox">${bubbles||'<p class="hint">暂无消息</p>'}</div><div class="field full"><label for="chatReply">回复</label><textarea id="chatReply" rows="3" maxlength="1000"></textarea></div>`,async()=>{if(!$('chatReply').value.trim())throw Error('请输入回复内容');await post(`shop-messages/${id}/reply`,{content:$('chatReply').value});notify('已回复，买家会收到机器人通知');closeModalAfterSubmit();await load()},{label:'发送',wide:true});setTimeout(()=>{const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight},0);return}
if(current==='shop_applications'&&name==='appapprove'){const cats=menuChoices.filter(m=>m.action_type==='merchants'&&m.parent_id);if(!cats.length){notify('请先在「动态菜单」中创建入口类型为「商家列表」的子菜单。',true);return}openModal('通过入驻申请 · '+row.shop_name,`<div class="form-grid"><div class="hint full" style="margin-bottom:12px">将创建商家「${esc(row.shop_name)}」和商家后台账号，并把账号和初始密码通过机器人发送给申请人。</div>${selectField('appMenu','商家分类（子菜单）',cats.map(m=>[String(m.id),m.title]),String(cats[0].id),true)}${field('appRate','平台佣金比例（0.05 = 5%）','text','0','',true)}${field('appNote','备注（可选）','text','','',true)}</div>`,async()=>{const r=await post(`shop-applications/${id}/approve`,{menu_id:Number(value('appMenu')),commission_rate:value('appRate'),note:value('appNote')});closeModalAfterSubmit();await load();if(r.delivered)notify(`已通过，账号 ${r.username} 已发送给申请人`);else openModal('请手动告知申请人',`<p style="line-height:1.9">机器人消息发送失败，请通过其他方式告知申请人：<br>账号：<code>${esc(r.username)}</code><br>初始密码：<code>${esc(r.password)}</code><br>此密码只显示这一次。</p>`,null)},{label:'通过'});return}
if(current==='shop_applications'&&name==='appreject'){openModal('拒绝入驻申请 · '+row.shop_name,`<div class="form-grid">${field('appRejectNote','拒绝原因（申请人可见）','text','','',true)}</div>`,async()=>{await post(`shop-applications/${id}/reject`,{note:value('appRejectNote')});notify('已拒绝，申请人会收到通知');closeModalAfterSubmit();await load()},{label:'拒绝'});return}
if(current==='shop_reviews'&&name==='rvreply'){openModal('回复评价',`<div class="form-grid"><div class="hint full" style="margin-bottom:12px">${'★'.repeat(row.rating)} ${esc(row.content||'（无文字）')}</div><div class="field full"><label for="rvText">回复（买家和其他用户可见，留空则删除回复）</label><textarea id="rvText" rows="4">${esc(row.reply||'')}</textarea></div></div>`,async()=>{await post(`shop-reviews/${id}/reply`,{reply:$('rvText').value});notify('已保存回复');closeModalAfterSubmit();await load()});return}
if(current==='shop_reviews'&&name==='rvhide'){await post(`shop-reviews/${id}/hidden`,{hidden:!row.hidden});notify(row.hidden?'评价已恢复展示':'评价已隐藏');await load();return}
if(current==='shop_aftersales'&&name==='asapprove'){openModal('同意退货 · '+row.order_no,`<div class="form-grid"><div class="field full"><label for="asAddr">退货地址（留空使用系统配置或商家地址）</label><textarea id="asAddr" rows="2"></textarea></div>${field('asNote','说明（买家可见，可选）','text','','',true)}</div>`,async()=>{await post(`shop-aftersales/${id}/approve`,{address:$('asAddr').value,note:value('asNote')});notify('已同意退货，买家会收到寄回地址');closeModalAfterSubmit();await load()},{label:'同意退货'});return}
if(current==='shop_aftersales'&&name==='asrefund'){openModal('售后退款 · '+row.order_no,`<div class="form-grid"><div class="hint full" style="margin-bottom:12px">买家申请 ${usdt(row.amount)} USDT。退款会立即退回买家钱包余额，可少于申请金额。${row.type==='return'?'<br><strong>请确认已收到退货。</strong>':''}</div>${field('asAmount','退款金额（USDT）','text',usdt(row.amount),'',true)}${field('asNote','说明（买家可见，可选）','text','','',true)}</div>`,async()=>{await post(`shop-aftersales/${id}/refund`,{amount:value('asAmount'),note:value('asNote')});notify('已退款');closeModalAfterSubmit();await load()},{label:'确认退款'});return}
if(current==='shop_aftersales'&&name==='asreject'){openModal('拒绝售后 · '+row.order_no,`<div class="form-grid">${field('asNote','拒绝原因（买家可见）','text','','',true)}</div>`,async()=>{await post(`shop-aftersales/${id}/reject`,{note:value('asNote')});notify('已拒绝');closeModalAfterSubmit();await load()},{label:'拒绝'});return}
if(current==='shop_products'&&name==='codes'){const live=(row.skus||[]).filter(k=>k.enabled);if(!live.length){notify('该商品没有可用规格。',true);return}openModal('导入卡密 · '+row.name,`<div class="form-grid">${selectField('codeSku','规格',live.map(k=>[String(k.id),k.name+'（剩余卡密 '+(row.codes?.[k.id]||0)+'）']),String(live[0].id),true)}<div class="field full"><label for="codeText">卡密（每行一条）</label><textarea id="codeText" rows="8"></textarea></div><div class="hint full">导入后库存自动增加相应数量；买家付款后按顺序自动发放。卡密不足时订单停在「待处理」，需手动发放。</div></div>`,async()=>{const r=await post('shop-products/codes',{sku_id:Number(value('codeSku')),codes:$('codeText').value});notify('已导入 '+r.imported+' 条卡密');closeModalAfterSubmit();await load()},{label:'导入'});return}
if(current==='shop_orders'&&name==='fulfil'){const t=row.delivery_type;const body=t==='express'?field('fCarrier','快递公司','text','','例如：顺丰速运',true)+field('fTracking','快递单号','text','','',true):t==='pickup'?`<div class="hint full" style="margin-bottom:12px">自提地址：${esc(row.address||'未设置商家地址')}</div><div class="field full"><label for="fNote">取货说明（可选）</label><textarea id="fNote" rows="3" placeholder="例如：取货码 A12，营业时间内到店出示订单号"></textarea></div>`:`<div class="field full"><label for="fNote">发放内容（卡密、兑换码或说明）</label><textarea id="fNote" rows="6"></textarea></div>`;openModal(({express:'订单发货',pickup:'备货完成',virtual:'发放虚拟商品'})[t]+' · '+row.order_no,`<div class="form-grid">${body}</div>`,async()=>{await post(`shop-orders/${id}/fulfil`,{carrier:value('fCarrier'),tracking_no:value('fTracking'),note:$('fNote')?.value||''});notify('已处理，买家会收到机器人通知');closeModalAfterSubmit();await load()},{label:'确认'});return}
if(current==='shop_orders'&&name==='finish'){openModal('确认完成',`<p style="line-height:1.9;color:var(--muted)">确认订单 ${esc(row.order_no)} 已${row.status==='ready'?'被买家取走':'送达'}并完成？</p>`,async()=>{await post(`shop-orders/${id}/complete`);notify('订单已完成');closeModalAfterSubmit();await load()},{label:'确认'});return}
if(current==='shop_orders'&&name==='refund'){openModal('取消并退款 · '+row.order_no,`<div class="form-grid"><div class="hint full" style="margin-bottom:12px">将退回 ${usdt(row.pay_amount)} USDT 到买家钱包余额，恢复库存，并退回已用优惠券。${row.status==='shipped'?'<br><strong>该订单已发货，请确认已拦截或已退货。</strong>':''}</div>${field('refundReason','取消原因（买家可见）','text','','例如：商品缺货',true)}</div>`,async()=>{await post(`shop-orders/${id}/cancel`,{reason:value('refundReason')});notify('订单已取消并退款');closeModalAfterSubmit();await load()},{label:'取消并退款'});return}
if(current==='shop_coupons'&&name==='issue'){openModal('定向发放 · '+row.name,`<div class="form-grid"><div class="field full"><label for="issueIds">Telegram 用户 ID（用逗号、空格或换行分隔）</label><textarea id="issueIds" rows="5" placeholder="123456789, 987654321"></textarea></div><div class="hint full">每人发 1 张，受发放总量和每人限领约束；未使用过机器人的用户会被跳过。</div></div>`,async()=>{const r=await post(`shop-coupons/${id}/issue`,{telegram_ids:$('issueIds').value});notify(`已发放 ${r.issued} 张`+(r.skipped?.length?`，跳过 ${r.skipped.length} 人`:''));closeModalAfterSubmit();await load()},{label:'发放'});return}
if(['delete','cancel','reject','rescan'].includes(name)){const message=name==='delete'?(current==='pushes'?'删除此任务及其发送明细？已送达 Telegram 的消息会保留。':'确定删除此记录？'):name==='cancel'?'取消后未发送用户将不再投递。确定取消？':name==='rescan'?'从历史开始补扫该充值地址？已入账交易不会重复入账。':'确定拒绝这笔提现并解冻余额？';openModal('确认操作',`<p style="line-height:1.9;color:var(--muted)">${message}</p>`,async()=>{await execute(name,id);closeModalAfterSubmit();await load()},{label:'确认'});return}await execute(name,id);await load()}catch(e){notify(e.message,true)}}
async function execute(name,id){if(name==='delete')await api(`${apiPath(current)}/${id}`,{method:'DELETE'});else await post(`${apiPath(current)}/${id}/${name}`,name==='reject'?{note:'后台审核拒绝'}:{});notify(({pause:'任务已暂停',resume:'任务已恢复',cancel:'任务已取消',delete:'记录已删除',retry:'失败用户已重新入队',approve:'审核已通过',rescan:'历史补扫已安排'})[name]||'操作成功')}
$('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)load(b.dataset.nav)});$('content').addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,Number(a.dataset.id));return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;page=1;render();return}const p=e.target.closest('[data-page]');if(p&&!p.disabled){page=Number(p.dataset.page);render()}});$('content').addEventListener('input',e=>{if(e.target.id==='search'){const position=e.target.selectionStart;query=e.target.value;page=1;render();$('search').focus();$('search').setSelectionRange(position,position)}});
$('create').onclick=()=>edit();$('refresh').innerHTML=icon('refresh')+' <span class="refresh-label">刷新</span>';$('refresh').onclick=()=>load();$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('submitModal').onclick=async()=>{if(!submitHandler)return;$('submitModal').disabled=true;try{await submitHandler()}catch(e){notify(e.message,true)}finally{$('submitModal').disabled=false}};
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const all=[...$('modal').querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled&&x.getClientRects().length);if(!all.length)return;if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});
$('changePassword').onclick=()=>openModal('修改密码',`<div class="form-grid">${field('oldPassword','原密码','password','','',true)}${field('newPassword','新密码','password','','至少 8 位',true)}${field('newPassword2','确认新密码','password','','',true)}</div>`,async()=>{if($('newPassword').value!==$('newPassword2').value)throw Error('两次输入的新密码不一致。');await post('account/password',{old_password:$('oldPassword').value,new_password:$('newPassword').value});notify('密码已修改，其他设备上的登录已失效');closeModalAfterSubmit()});
function showMe(){$('meName').textContent=me.username||'管理员';$('meRole').textContent=me.role==='super'?'超级管理员':me.role==='merchant'?'商家 · '+(me.merchant_name||''):me.role==='merchant_staff'?'员工 · '+(me.merchant_name||''):'管理员';$('meAvatar').textContent=(me.username||'AD').slice(0,2).toUpperCase()}
$('logout').onclick=async()=>{try{const res=await fetch(API+'/admin/logout',{credentials:'include',method:'POST',headers:{'X-Requested-With':'admin-console'}});if(!res.ok)throw Error('退出失败，请稍后重试');location.replace('/admin/login')}catch(e){notify(e.message,true)}};
window.addEventListener('pagehide',()=>{document.body.style.visibility='hidden'});window.addEventListener('pageshow',async e=>{if(e.persisted){try{await api('session');document.body.style.visibility=''}catch(error){location.replace('/admin/login')}}else document.body.style.visibility=''});window.addEventListener('resize',closeSelect);
$('brandIcon').innerHTML=icon('send');$('today').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});api('session').then(m=>{me=m;showMe()}).catch(()=>{}).finally(()=>{const first=groups.flatMap(([,items])=>items).find(allowed);if(first)load(first);else{nav();$('pageTitle').textContent='暂无可访问页面';$('pageDescription').textContent='';$('create').hidden=true;$('content').innerHTML='<div class="panel empty">当前账号尚未分配可访问的页面，请联系超级管理员在「角色权限」中分配。</div>'}});
</script>

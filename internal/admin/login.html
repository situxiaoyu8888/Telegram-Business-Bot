<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 讯舟</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#e6eaff,transparent 55%),#f5f7fb;color:#18243b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.card{width:410px;max-width:100%;background:#fff;border:1px solid #e8edf4;border-radius:22px;padding:40px;box-shadow:0 20px 70px #24376810}.mark{background:#5264e8;color:#fff;border-radius:14px;width:48px;height:48px;display:grid;place-items:center;font-size:25px;margin-bottom:28px}h1{font-size:25px;margin:0 0 10px}p{color:#8994a8;line-height:1.7;margin:0 0 30px}label{display:block;color:#5b6880;font-size:12px;margin:18px 0 8px}input{width:100%;border:1px solid #dfe5ef;border-radius:9px;padding:13px;font:inherit;outline:none}input:focus{border-color:#8996f4;box-shadow:0 0 0 3px #5264e813}button{width:100%;border:0;background:#5264e8;color:white;border-radius:9px;padding:14px;margin-top:25px;cursor:pointer;font:inherit}button:disabled{opacity:.6}button:focus-visible{outline:3px solid #9ca8ff;outline-offset:3px}#error{color:#bf5268;line-height:1.7;margin-top:14px;font-size:12px}.foot{text-align:center;color:#a0aaba;font-size:10px;letter-spacing:2px;margin-top:28px}</style></head><body><main class="card"><div class="mark">➤</div><h1>欢迎回来</h1><p>登录讯舟，管理你的业务消息与用户。</p><form id="login"><label for="username">管理员账号</label><input id="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><div id="error" role="alert"></div><button id="submit">登录工作台</button></form><div class="foot">讯舟 · BUSINESS CONSOLE</div></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const res=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'admin-console'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await res.json();if(!res.ok)throw Error(data.error||'登录失败');location.replace('/admin/')}catch(e){error.textContent=e.message||'网络异常，请重试'}finally{button.disabled=false}};
</script></body></html>
